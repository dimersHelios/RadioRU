<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Радио России</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23ff3b30%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22%3E📻%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RadioRU">
<style>
:root{color-scheme:dark;--bg:#101114;--card:#1b1d22;--muted:#9ca3af;--line:#2b2f36;--accent:#ff3b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:3;background:rgba(16,17,20,.94);backdrop-filter:blur(16px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:28px;margin:0 0 10px}input{width:100%;border:1px solid var(--line);background:#202329;color:#fff;border-radius:12px;padding:12px 14px;font-size:16px}
.city{margin:22px 14px 0}.city-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 4px 10px}.city-name{font-size:21px;font-weight:750;line-height:1.15}.city-right{text-align:right;min-width:150px}.city-time{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}.city-weather{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.25}
.station{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 11px;border-bottom:1px solid var(--line)}.station:first-of-type{border-radius:14px 14px 0 0}.station:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.logo{width:46px;height:46px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 46px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}.logo img{width:100%;height:100%;object-fit:contain;padding:5px}.logo .fallback{color:#3c4048;font-size:11px;font-weight:800;text-align:center;padding:3px;line-height:1.05}
.play{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:#343841;color:#fff;font-size:15px}.station.active .play{background:var(--accent)}.meta{min-width:0;flex:1}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:13px;margin-top:3px}.fav{border:0;background:transparent;color:#8d929b;font-size:24px;padding:5px}.fav.on{color:#ffd60a}
#player{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(28,30,35,.97);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px}.player-logo{width:44px;height:44px;border-radius:10px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}.player-logo img{width:100%;height:100%;object-fit:contain;padding:5px}.ptext{flex:1;min-width:0}.pname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pcity{color:var(--muted);font-size:13px;margin-top:2px}.pbtn{width:44px;height:44px;border:0;border-radius:50%;background:#343841;color:#fff;font-size:18px}.hint{color:var(--muted);font-size:13px;padding:18px 18px 0;line-height:1.4}
@media(max-width:390px){.city-right{min-width:132px}.city-weather{font-size:11px}.logo{width:42px;height:42px;flex-basis:42px}.play{width:36px;height:36px;flex-basis:36px}.station{gap:8px}}
</style>
</head>
<body>
<header><h1>Радио России</h1><input id="search" placeholder="Станция или город"></header>
<div id="list"></div>
<div class="hint">Погода загружается через Open‑Meteo. В этом плеере нет рекламы, аналитики и трекеров. Реклама самой радиостанции внутри живого эфира может звучать — убрать её без изменения эфира невозможно.</div>
<div id="player"><div class="player-logo" id="plogo"></div><div class="ptext"><div class="pname" id="pname"></div><div class="pcity" id="pcity"></div></div><button class="pbtn" id="toggle">❚❚</button><button class="pbtn" id="stop">×</button></div>
<audio id="audio" playsinline></audio>
<script>
const cities = {
  'Москва':{lat:55.7558,lon:37.6173,tz:'Europe/Moscow'},
  'Санкт-Петербург':{lat:59.9343,lon:30.3351,tz:'Europe/Moscow'},
  'Казань':{lat:55.7961,lon:49.1064,tz:'Europe/Moscow'},
  'Екатеринбург':{lat:56.8389,lon:60.6057,tz:'Asia/Yekaterinburg'},
  'Волгоград':{lat:48.7080,lon:44.5133,tz:'Europe/Volgograd'},
  'Самара':{lat:53.1959,lon:50.1002,tz:'Europe/Samara'},
  'Владивосток':{lat:43.1155,lon:131.8855,tz:'Asia/Vladivostok'},
  'Мурманск':{lat:68.9585,lon:33.0827,tz:'Europe/Moscow'},
  'Рязань':{lat:54.6296,lon:39.7425,tz:'Europe/Moscow'}
};
const stations = [
['Москва','Русское Радио','','https://rusradio.hostingradio.ru/rusradio96.aacp','rusradio.ru'],
['Москва','Радио Шансон','','https://chanson.hostingradio.ru:8041/chanson256.mp3','radioshanson.ru'],
['Москва','Monte Carlo','','https://montecarlo.hostingradio.ru/montecarlo96.aacp','montecarlo.ru'],
['Москва','Наше Радио','','https://nashe1.hostingradio.ru/nashe-128.mp3','nashe.ru'],
['Москва','Серебряный Дождь','','http://213.59.4.27:8000/silver128.mp3','silver.ru'],
['Москва','Бизнес FM','','http://bfm.hostingradio.ru:8004/fm','bfm.ru'],
['Москва','Страна FM','','http://icecast.stranafm.cdnvideo.ru/stranafm_256','stranafm.ru'],
['Москва','Радио Родных Дорог','','https://stream1.radiord.ru:8000/live128.mp3','radiord.ru'],
['Москва','Европа Плюс','','http://ep128.hostingradio.ru:8030/ep128?magic=true','europaplus.ru'],
['Москва','Вести FM','','http://icecast.vgtrk.cdnvideo.ru/vestifm_mp3_192kbps','radiovesti.ru'],
['Санкт-Петербург','Radio Record','106.3 FM','https://radiorecord.hostingradio.ru/rr_main96.aacp','radiorecord.ru'],
['Санкт-Петербург','Питер FM','100.9 FM','https://icecast-piterfm.cdnvideo.ru/piterfm','piter.fm'],
['Санкт-Петербург','Радио Зенит','89.7 FM','http://stream.radiozenit.ru:8000/mp3','radiozenit.ru'],
['Казань','БИМ-радио','','http://av.bimradio.ru:8066/bim_mp3_128k','bimradio.ru'],
['Казань','Татар Радиосы','100.5 FM','https://tatarradio.hostingradio.ru/tatarradio320.mp3','tatarradio.ru'],
['Казань','Тартип FM','93.1 FM','http://radio.tatmedia.com:8800/tartipfm128','tartip.tatar'],
['Казань','Китап FM','','http://radio.tatmedia.com:8800/kitapfm','kitap.tatar'],
['Екатеринбург','Радио СИ','','http://188.254.50.254:8000/radioc256','radiosi.ru'],
['Екатеринбург','Юмор FM — Екатеринбург','102.0 FM','http://hls-01-gpm.hostingradio.ru/humorfm343/128/playlist.m3u8','humorfm.ru'],
['Волгоград','Радио Спутник','','http://online.sputnikfm.ru:8000/sputnik_mp3','sputnikfm.ru'],
['Волгоград','Волгоград FM','','http://online.volgogradfm.ru:8000/vfm','volgogradfm.ru'],
['Самара','Время Звучать!','','http://vzradio.ru:8000/onair','vzradio.ru'],
['Владивосток','Владивосток FM','','http://vladfm.com:8000/vfm','vladfm.com'],
['Мурманск','Большое Радио','','http://listen.myradio24.com:9000/8286','big-radio.ru'],
['Рязань','ТКР-FM','','http://176.118.220.124:8010/radio','tkr-radio.ru'],
['Рязань','Пи-FM','','http://82.146.57.157:8000/pifm62','pifm.ru']
].map((x,i)=>({id:'s'+i,city:x[0],name:x[1],freq:x[2],url:x[3],domain:x[4]}));

const audio=document.getElementById('audio'), list=document.getElementById('list'), p=document.getElementById('player'), pname=document.getElementById('pname'), pcity=document.getElementById('pcity'), toggle=document.getElementById('toggle'), plogo=document.getElementById('plogo');
let current=null;
const fav=new Set(JSON.parse(localStorage.getItem('fav')||'[]'));
const weatherByCity={};

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(name){return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'FM'}
function logoURL(domain){return `https://www.google.com/s2/favicons?sz=128&domain=${encodeURIComponent(domain)}`}
function logoHTML(s){return `<div class="logo"><img src="${logoURL(s.domain)}" alt="${esc(s.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback" style="display:none">${esc(initials(s.name))}</span></div>`}
function cityTime(city){const c=cities[city]; if(!c)return ''; try{return new Intl.DateTimeFormat('ru-RU',{timeZone:c.tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}catch{return ''}}
function weatherEmoji(code){if(code===0)return '☀️';if([1,2].includes(code))return '🌤️';if(code===3)return '☁️';if([45,48].includes(code))return '🌫️';if([51,53,55,56,57].includes(code))return '🌦️';if([61,63,65,66,67,80,81,82].includes(code))return '🌧️';if([71,73,75,77,85,86].includes(code))return '🌨️';if([95,96,99].includes(code))return '⛈️';return '☁️'}
function weatherText(city){const w=weatherByCity[city]; if(w===null)return 'Погода недоступна'; if(!w)return 'Погода загружается…'; return `${weatherEmoji(w.code)} сейчас ${Math.round(w.current)}° · сегодня ${Math.round(w.min)}…${Math.round(w.max)}°`}

function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  list.innerHTML='';
  const filtered=stations.filter(s=>!q||s.name.toLowerCase().includes(q)||s.city.toLowerCase().includes(q));
  const names=[...new Set(filtered.map(s=>s.city))].sort((a,b)=>a.localeCompare(b,'ru'));
  names.forEach(city=>{
    const sec=document.createElement('section');sec.className='city';
    sec.innerHTML=`<div class="city-title"><div class="city-name">${esc(city)}</div><div class="city-right"><div class="city-time" data-city-time="${esc(city)}">${esc(cityTime(city))}</div><div class="city-weather" data-city-weather="${esc(city)}">${esc(weatherText(city))}</div></div></div>`;
    filtered.filter(s=>s.city===city).sort((a,b)=>a.name.localeCompare(b.name,'ru')).forEach(s=>{
      const row=document.createElement('div');row.className='station'+(current?.id===s.id?' active':'');
      row.innerHTML=`${logoHTML(s)}<button class="play">${current?.id===s.id&&!audio.paused?'❚❚':'▶'}</button><div class="meta"><div class="name">${esc(s.name)}</div><div class="sub">${esc(s.freq||'Интернет-поток')}</div></div><button class="fav ${fav.has(s.id)?'on':''}">${fav.has(s.id)?'★':'☆'}</button>`;
      row.querySelector('.play').onclick=()=>play(s);
      row.querySelector('.fav').onclick=()=>{fav.has(s.id)?fav.delete(s.id):fav.add(s.id);localStorage.setItem('fav',JSON.stringify([...fav]));render()};
      sec.appendChild(row)
    });
    list.appendChild(sec)
  });
}

function updateCityHeaders(){
  document.querySelectorAll('[data-city-time]').forEach(el=>{el.textContent=cityTime(el.dataset.cityTime)});
  document.querySelectorAll('[data-city-weather]').forEach(el=>{el.textContent=weatherText(el.dataset.cityWeather)});
}

async function loadWeather(city){
  const c=cities[city]; if(!c)return;
  const params=new URLSearchParams({latitude:c.lat,longitude:c.lon,current:'temperature_2m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min',timezone:c.tz,forecast_days:'1'});
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params.toString(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    weatherByCity[city]={current:j.current.temperature_2m,min:j.daily.temperature_2m_min[0],max:j.daily.temperature_2m_max[0],code:j.current.weather_code};
  }catch(e){weatherByCity[city]=null}
  updateCityHeaders();
}
async function loadAllWeather(){await Promise.all(Object.keys(cities).map(loadWeather))}

function setPlayerLogo(s){plogo.innerHTML=`<img src="${logoURL(s.domain)}" alt="${esc(s.name)}" onerror="this.parentElement.textContent='${esc(initials(s.name))}'">`}
function play(s){
  if(current?.id===s.id){audio.paused?audio.play():audio.pause();render();return}
  current=s;audio.src=s.url;audio.play().catch(()=>{});p.style.display='flex';pname.textContent=s.name;pcity.textContent=s.city+(s.freq?' • '+s.freq:'');setPlayerLogo(s);toggle.textContent='❚❚';render()
}
audio.onplay=()=>{toggle.textContent='❚❚';render()};
audio.onpause=()=>{toggle.textContent='▶';render()};
audio.onerror=()=>{pcity.textContent=(current?.city||'')+' • поток недоступен'};
toggle.onclick=()=>audio.paused?audio.play():audio.pause();
document.getElementById('stop').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();current=null;p.style.display='none';render()};
document.getElementById('search').oninput=render;
render();loadAllWeather();setInterval(updateCityHeaders,30000);setInterval(loadAllWeather,15*60*1000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
